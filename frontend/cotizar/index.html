<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cotizador Tajy — Nueva cotización</title>
    <script>
      ;(function () {
        try {
          var t =
            localStorage.getItem('tajy-theme') ||
            (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          document.documentElement.setAttribute('data-theme', t)
        } catch (e) {}
      })()
    </script>
    <link rel="icon" href="../shared/logo/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&family=Inter:wght@600&family=Roboto+Mono:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../shared/cotizador.css" />
    <link rel="stylesheet" href="../shared/badge.css" />
    <link rel="stylesheet" href="../shared/theme-dark.css" />
  </head>
  <body>
    <div id="app" class="app-shell"></div>
    <script src="../shared/config.js"></script>
    <script src="../shared/theme.js"></script>
    <script type="module" src="./cotizar.js"></script>
  </body>
</html>
