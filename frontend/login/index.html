<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cotizador Tajy — Ingresar</title>
    <script>
      ;(function () {
        try {
          var t =
            localStorage.getItem('tajy-theme') ||
            (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          document.documentElement.setAttribute('data-theme', t)
        } catch (e) {}
      })()
    </script>
    <link rel="icon" href="../shared/logo/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="./login.css" />
    <link rel="stylesheet" href="../shared/theme-dark.css" />
  </head>
  <body>
    <div id="app-splash" class="app-splash" aria-hidden="true">
      <div class="app-splash__content">
        <img
          class="app-splash__logo app-splash__logo--light"
          src="./assets/logo-rojo-con-negro.svg"
          alt="Aseguradora Tajy"
        />
        <img
          class="app-splash__logo app-splash__logo--dark"
          src="../logo/logo-dark.png"
          alt="Aseguradora Tajy"
        />
        <span class="app-splash__loader"></span>
      </div>
    </div>
    <main id="app" class="login-shell"></main>
    <script src="../shared/config.js"></script>
    <script src="../shared/theme.js"></script>
    <script type="module" src="./login.js"></script>
  </body>
</html>
