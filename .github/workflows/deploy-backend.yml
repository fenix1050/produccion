name: Deploy backend (legacy disabled)

# LEGACY WORKFLOW - DISABLED
#
# Este workflow desplegaba automáticamente el backend directamente a PROD
# después de un CI exitoso en main, reconstruyendo la imagen en el servidor.
#
# Se deshabilita durante la implementación del nuevo flujo:
#
#   build release
#   -> deploy TEST
#   -> validate
#   -> manual approval
#   -> promote exact release to PROD
#   -> rollback without rebuild
#
# No eliminar todavía: se conserva temporalmente como referencia histórica.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-deploy-disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest

    steps:
      - name: Legacy deployment disabled
        run: |
          echo "Legacy backend deployment is disabled."
          echo "Use the TEST -> validate -> promote release workflow instead."
