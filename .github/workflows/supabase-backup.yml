name: Backup Supabase DB (legacy disabled)

# LEGACY WORKFLOW - DISABLED
#
# Este workflow hacía un pg_dump semanal contra el proyecto Supabase cloud
# (secreto SUPABASE_DB_URL). Ese proyecto ya no existe: PROD y TEST son
# Supabase self-hosted en la VPS, y desde 2026-09-20 el workflow falla con
# "ENOTFOUND tenant/user ... not found".
#
# Lo reemplaza el backup diario de la VPS (scripts/backup-prod-db.sh, cron
# 03:30, copia cifrada a Google Drive). Ver docs/RUNBOOK_BACKUP_PROD.md.
#
# No eliminar todavía: se conserva temporalmente como referencia histórica.
# Se quitó el cron para que deje de correr y de fallar cada domingo.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Instalar postgresql-client 17 (matchea la versión del server de Supabase)
        run: |
          sudo apt-get install -y postgresql-common
          yes | sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh
          sudo apt-get install -y postgresql-client-17

      - name: Generar dump de la base
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          DATE=$(date +%Y-%m-%d)
          FILENAME="supabase-backup-${DATE}.dump"
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" -F c -f "$FILENAME"
          gzip "$FILENAME"
          echo "DATE=${DATE}" >> "$GITHUB_ENV"
          echo "FILENAME=${FILENAME}.gz" >> "$GITHUB_ENV"

      - name: Subir como artifact (no público — requiere login + acceso de lectura al repo)
        uses: actions/upload-artifact@v7.0.1
        with:
          name: supabase-backup-${{ env.DATE }}
          path: ${{ env.FILENAME }}
          retention-days: 30
