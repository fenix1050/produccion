services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cotizador-tajy-backend
    restart: unless-stopped
    env_file:
      - backend/.env
    # env_file pisa el ENV NODE_ENV=production horneado en backend/Dockerfile si esa
    # variable llega a estar ausente o distinta en backend/.env de la VPS — forzarla acá
    # asegura que cookies.js siempre trate el entorno como producción (Domain
    # compartido .cotizador.lat entre frontend/API), sin depender del contenido del .env.
    environment:
      - NODE_ENV=production
    expose:
      - '3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - web
      - supabase_internal

  caddy:
    image: caddy:2-alpine
    container_name: cotizador-tajy-caddy
    restart: unless-stopped
    ports:
      - '80:80'

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cotizador-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token-file /run/secrets/cloudflared-token
    volumes:
      - /opt/cotizador/secrets/cloudflared-token:/run/secrets/cloudflared-token:ro
    networks:
      - web

networks:
  web:
  supabase_internal:
    external: true
    name: cotizador_supabase_internal

volumes:
  caddy_data:
  caddy_config:
