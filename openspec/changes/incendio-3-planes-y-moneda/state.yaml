resolved_questions:
  - 'Tipo de cambio: tabla vigente, poblada automaticamente desde API publica de dolarPy (cotizacion SET, https://dolar.melizeche.com/api/1.0/). Confirmado por Kevin 2026-07-27.'
  - 'Umbral de inspeccion aplica SOLO a con/sin Inspeccion. Incendio Hipotecario queda fuera de la regla. Confirmado por Kevin 2026-07-27.'
  - 'Los 4 objetos de riesgo son opcionales, no obligatorios. Confirmado por Kevin 2026-07-27.'
  - "DISENO: snapshot de tipo de cambio usa el campo 'venta' de dolarpy.set (criterio conservador); se persisten compra y venta para poder cambiar de criterio sin re-fetch."
  - 'DISENO: tipo de cambio on-demand con withCache (TTL 15 min) + tabla append-only tipos_cambio como fallback durable. Sin cron/setInterval.'
  - 'DISENO: umbral de inspeccion como columnas de planes (requiere_inspeccion / umbral_inspeccion_monto / umbral_inspeccion_moneda), NULL = regla no aplica. Editable desde el panel admin sin deploy.'
  - 'DISENO: no hay conversion de montos entre monedas; el tipo de cambio solo se usa para comparar contra el umbral y como snapshot de trazabilidad.'
  - 'DISENO: piso prima_tecnica_minima por moneda explicito (columna prima_tecnica_minima_usd), sin conversion implicita; 422 si falta el piso de la moneda cotizada.'
open_questions:
  - 'Tasas global/minima/maxima por tipo de riesgo mas alla de Vivienda Familiar — Kevin confirma la semana del 2026-08-03. No bloquea implementar el mecanismo generico.'
  - 'Monto final del umbral de inspeccion (~USD 700.000, no confirmado) y en que moneda se expresa canonicamente.'
  - 'Prima tecnica minima propia de los 3 planes nuevos y en que moneda.'
  - 'Si el umbral (en USD) se compara contra una cotizacion en Gs., que manda: monto declarado o conversion con el tipo de cambio snapshot de esa cotizacion.'
  - 'RESUELTA EN DISENO: frecuencia/cacheo del tipo de cambio — on-demand con TTL de 15 min y fallback al ultimo valor persistido.'
  - 'Semantica exacta de tasa_minima/tasa_maxima por tipo de riesgo: banda de validacion de la tasa global o clamp de la tasa efectiva. El diseno las persiste pero NO las aplica como clamp hasta confirmar.'
  - "Se permite 'con Inspeccion' por debajo del umbral (sobre-inspeccionar), o tambien se bloquea. El diseno hoy solo bloquea la direccion insegura."
  - 'El override manual de tipo de cambio necesita UI en el panel admin en este cambio, o alcanza con INSERT por SQL como salvavidas.'
notes:
