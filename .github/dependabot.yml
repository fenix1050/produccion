version: 2

updates:
  - package-ecosystem: 'npm'
    directory: '/'

    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '03:00'

    open-pull-requests-limit: 5

    groups:
      npm-dependencies:
        patterns:
          - '*'

  - package-ecosystem: 'github-actions'
    directory: '/'

    schedule:
      interval: 'weekly'
      day: 'tuesday'
      time: '03:00'

    groups:
      github-actions:
        patterns:
          - '*'
