name: Backup Supabase DB

on:
  schedule:
    - cron: '0 3 * * 0' # Domingo 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar postgresql-client 17 (matchea la versión del server de Supabase)
        run: |
          sudo apt-get install -y postgresql-common
          yes | sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh
          sudo apt-get install -y postgresql-client-17

      - name: Generar dump de la base
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          DATE=$(date +%Y-%m-%d)
          FILENAME="supabase-backup-${DATE}.dump"
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" -F c -f "$FILENAME"
          gzip "$FILENAME"
          echo "DATE=${DATE}" >> "$GITHUB_ENV"
          echo "FILENAME=${FILENAME}.gz" >> "$GITHUB_ENV"

      - name: Publicar como release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: db-backup-${{ env.DATE }}-${{ github.run_id }}
          name: 'Backup Supabase ${{ env.DATE }}'
          files: ${{ env.FILENAME }}
          body: Backup automático semanal de la base de Supabase.
