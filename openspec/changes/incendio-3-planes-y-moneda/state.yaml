resolved_questions:
  - 'Tipo de cambio: tabla vigente, poblada automaticamente desde API publica de dolarPy (cotizacion SET, https://dolar.melizeche.com/api/1.0/). Confirmado por Kevin 2026-07-27.'
  - 'Umbral de inspeccion aplica SOLO a con/sin Inspeccion. Incendio Hipotecario queda fuera de la regla. Confirmado por Kevin 2026-07-27.'
  - 'Los 4 objetos de riesgo son opcionales, no obligatorios. Confirmado por Kevin 2026-07-27.'
  - "DISENO: snapshot de tipo de cambio usa el campo 'venta' de dolarpy.set (criterio conservador); se persisten compra y venta para poder cambiar de criterio sin re-fetch."
  - 'DISENO: tipo de cambio on-demand con withCache (TTL 15 min) + tabla append-only tipos_cambio como fallback durable. Sin cron/setInterval.'
  - 'DISENO: umbral de inspeccion como columnas de planes (requiere_inspeccion / umbral_inspeccion_monto / umbral_inspeccion_moneda), NULL = regla no aplica. Editable desde el panel admin sin deploy.'
  - 'DISENO: no hay conversion de montos entre monedas; el tipo de cambio solo se usa para comparar contra el umbral y como snapshot de trazabilidad.'
  - 'DISENO: piso prima_tecnica_minima por moneda explicito (columna prima_tecnica_minima_usd), sin conversion implicita; 422 si falta el piso de la moneda cotizada.'
  - "CONFIRMADO POR KEVIN (contexto de arranque de PR4, 2026-07-27): riesgo_datos.rubro_actividad es el campo correcto para llevar el nombre del 'Tipo de Riesgo' (tipos_riesgo_incendio.nombre, ej. 'VIVIENDA FAMILIAR') en la mecanica objeto_riesgo — no hace falta un campo dedicado nuevo. Cierra la pregunta abierta que habia quedado documentada en el batch 3 de apply-progress.md."
  - 'CONFIRMADO POR KEVIN en verificacion en vivo (2026-07-27, migracion 039): prima tecnica minima de los 3 planes nuevos = Gs. 409.091 (mismo piso que MRC); responsabilidad maxima cotizable = Gs. 60.000.000.000 para los 3 planes nuevos y USD 5.000.000 para MAQUINARIA BASICO (quedaba NULL desde la migracion 018); umbral de inspeccion = USD 700.000 para con/sin Inspeccion.'
  - "BUG REAL encontrado y corregido en verificacion en vivo (2026-07-27, migracion 040): tipos_riesgo_incendio.nombre quedo sembrado como 'VIVIENDA FAMILIAR' (migracion 038) pero el catalogo de rubros de actividad (/ramos/rubros-actividad, compartido con MRC) usa 'VIVIENDA' — findTasasRiesgoObjeto matchea por igualdad exacta de string, nunca hacian match, rechazaba con 422 cualquier cotizacion de Vivienda. Kevin confirmo renombrar la tasa (no el catalogo). Ver detalle en apply-progress.md Batch 5."
