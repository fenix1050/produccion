    <title>Cotizador Tajy — Ingresar</title>
    <script>
      ;(function () {
        try {
          var t =
            localStorage.getItem('tajy-theme') ||
            (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          document.documentElement.setAttribute('data-theme', t)
        } catch (e) {}
      })()
    </script>
